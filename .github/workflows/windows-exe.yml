name: Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.22.3
      - name: Run regression tests
        run: python -m unittest discover -v
      - name: Build Windows executable
        run: python scripts/build_windows.py
      - name: Test packaged application startup
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'autoparts-smoke'
          $report = Join-Path $env:RUNNER_TEMP 'autoparts-smoke.json'
          $exe = (Get-ChildItem dist -Filter *.exe).FullName
          $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test', $report -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Packaged application startup timed out'
          }
          if ($process.ExitCode -ne 0 -or -not (Test-Path $report)) {
            throw 'Packaged application startup failed'
          }
          $result = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $result.ok) { throw 'Smoke test report indicates failure' }
          Get-Content $report
      - uses: actions/upload-artifact@v7
        with:
          name: autoparts-windows-x64
          path: |
            dist/*.exe
            dist/README.txt
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
